# Builds the native proxy datapath addon (packages/node/native/warren-napi)
# for every platform the team runs Claude Code on, so `wclaude` installs
# without a local Rust toolchain.
#
# Runners: linux-x64 stays on the self-hosted libra pool, whose Debian 11 image
# gives this glibc-linked addon its glibc 2.31 floor (a GitHub-hosted Ubuntu
# would raise it for users); darwin-arm64 on the self-hosted Mac; win32-x64 on
# a GitHub-hosted windows-2025 runner.
#
# Needs the ENGINE_TOKEN secret: a fine-grained PAT with contents:read on
# WarrenBrowse/warren-sdk-rs, warrenguard and warren-contract (same one-time
# manual setup as VECTORS_TOKEN; those PATs cannot be minted via the API).
#
# The warren-napi Cargo.toml pins warren-sdk-rs by commit and patches the
# warrenguard and warren-contract crates to sibling checkouts five levels up,
# exactly like the local dev layout. The job checks the three engine repos out
# as siblings of this repo's checkout directory, each at the rev that pin
# implies (warren-sdk-rs at the pin, the other two at the revs its marker files
# name), and builds against the checked-out warren-sdk-rs through the same
# gitignored override a developer uses, so cargo never fetches a private repo.
#
# Binaries are published as assets on the rolling `native-prebuilds` release,
# NOT as Actions artifacts: the org artifact storage quota is exhausted (hit
# 2026-07-09) and release assets neither count against it nor expire.

name: native-prebuilds

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the rolling release (off: build only, a dry run)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: addon (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # The Linux .node links glibc and ships to users, so it is built inside the
    # Debian 11 job image (glibc 2.31) rather than on ubuntu-24.04 (2.39). The
    # darwin leg has no container.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            container:
              image: ghcr.io/warrenbrowse/warren-ci-linux:bullseye-e03e4fc686d82f6b1cbea663ec9032c76960b5ee
              options: --user root
            target: x86_64-unknown-linux-gnu
          - name: darwin-arm64
            runner: [self-hosted, macOS, ARM64]
            target: aarch64-apple-darwin
    steps:
      - name: Reset stale workspace
        shell: bash
        # Clear pnpm/action-setup's install dir too: on a reused self-hosted
        # Windows runner its cleanup hits ENOTEMPTY on a locked leftover
        # node_modules and the whole leg dies before the build. Removing it up
        # front lets the setup reinstall cleanly. The dir is the runner's own
        # (below), never the home directory the runner services of one machine
        # share: clearing that one deleted pnpm under a concurrent job.
        run: |
          rm -rf .git sdk-ts engine warren-sdk-rs warrenguard warren-contract 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/setup-pnpm" 2>/dev/null || true
      - uses: actions/checkout@v4
        with:
          path: sdk-ts
      - name: Engine revs from the pin
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          rev="$(sed -n -E 's/^warren-sdk = \{ git = "https:\/\/github.com\/WarrenBrowse\/warren-sdk-rs.git", rev = "([0-9a-f]{40})" \}$/\1/p' sdk-ts/packages/node/native/warren-napi/Cargo.toml)"
          test -n "$rev" || { echo "::error::no warren-sdk rev pin in warren-napi/Cargo.toml"; exit 1; }
          echo "sdk=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: WarrenBrowse/warren-sdk-rs
          ref: ${{ steps.pin.outputs.sdk }}
          token: ${{ secrets.ENGINE_TOKEN }}
          path: warren-sdk-rs
      - name: Sibling revs the pinned engine names
        id: siblings
        shell: bash
        run: |
          set -euo pipefail
          echo "warrenguard=$(tr -d '[:space:]' < warren-sdk-rs/.warrenguard-version)" >> "$GITHUB_OUTPUT"
          echo "contract=$(tr -d '[:space:]' < warren-sdk-rs/.warren-contract-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: WarrenBrowse/warrenguard
          ref: ${{ steps.siblings.outputs.warrenguard }}
          token: ${{ secrets.ENGINE_TOKEN }}
          path: warrenguard
      - uses: actions/checkout@v4
        with:
          repository: WarrenBrowse/warren-contract
          ref: ${{ steps.siblings.outputs.contract }}
          token: ${{ secrets.ENGINE_TOKEN }}
          path: warren-contract
      # The Cargo patch table resolves ../../../../../<repo> from the crate dir,
      # which is the parent of the sdk-ts checkout, where the siblings now sit.
      - name: Build against the checked-out engine
        shell: bash
        run: |
          set -euo pipefail
          test -d warren-sdk-rs && test -d warrenguard && test -d warren-contract
          mkdir -p sdk-ts/packages/node/native/warren-napi/.cargo
          printf '%s\n' '[patch."https://github.com/WarrenBrowse/warren-sdk-rs.git"]' \
            'warren-sdk = { path = "../../../../../warren-sdk-rs/crates/warren-sdk" }' \
            > sdk-ts/packages/node/native/warren-napi/.cargo/config.toml
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdk-ts/package.json
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Install the pinned toolchain on every runner: the macOS ARM64 runner
      # has rust but not rustup on this job's PATH (a bare `rustup target add`
      # there fails with "command not found"). dtolnay provides rustup + the host target on all.
      # The version follows warren-sdk-rs's rust-toolchain.toml, the engine's
      # floor (smoltcp 0.14 needs 1.91).
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: ${{ matrix.target }}
      - name: Rust target
        shell: bash
        run: rustup target add ${{ matrix.target }} || true
      - name: Build addon
        shell: bash
        working-directory: sdk-ts/packages/node/native/warren-napi
        run: |
          # --dts keeps the generated typings away from the curated index.d.ts
          # (napi's default output path, left empty on cached builds).
          pnpm --package=@napi-rs/cli dlx napi build --release --platform --target ${{ matrix.target }} --dts index.generated.d.ts
          ls -la *.node
      # napi suffixes some triples with the ABI (linux-x64-gnu, win32-x64-msvc);
      # normalize to the loader's `<process.platform>-<process.arch>` name.
      - name: Normalize binary name
        shell: bash
        working-directory: sdk-ts/packages/node/native/warren-napi
        run: |
          src="$(ls warren-napi.*.node | head -1)"
          test -n "$src"
          if [ "$src" != "warren-napi.${{ matrix.name }}.node" ]; then
            mv "$src" "warren-napi.${{ matrix.name }}.node"
          fi
          ls -la warren-napi.${{ matrix.name }}.node
      # Node-based publish: Actions artifacts are unusable (org storage quota).
      # (The wclaude launcher moved to its own repo WarrenBrowse/wclaude with
      # its own build workflow.)
      - name: Publish to the rolling release
        if: inputs.publish
        shell: bash
        working-directory: sdk-ts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-prebuild.mjs native-prebuilds \
            "packages/node/native/warren-napi/warren-napi.${{ matrix.name }}.node"

  addon-windows:
    name: addon (win32-x64)
    # Built against the same pinned engine as the matrix legs
    # (scripts/ci/codemagic/napi-windows.sh), each phase under the watchdog;
    # the addon is published only once it matches the checksum list the build
    # wrote.
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      WARREN_SHA: ${{ github.sha }}
    steps:
      - name: Allow long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchains and engine siblings
        run: bash scripts/ci/codemagic/watchdog.sh bash scripts/ci/codemagic/napi-windows.sh prepare
      - name: Build the addon
        run: bash scripts/ci/codemagic/watchdog.sh bash scripts/ci/codemagic/napi-windows.sh build
      - name: Verify the addon against the build's checksum list
        run: cd cm-out && sha256sum -c codemagic.sha256
      - uses: actions/setup-node@v4
        if: inputs.publish
        with:
          node-version: 20
      - name: Publish to the rolling release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-prebuild.mjs native-prebuilds cm-out/warren-napi.win32-x64.node
