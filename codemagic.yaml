# Windows builds of warren-sdk-ts, run on Codemagic windows_x2 machines.
#
# Nothing here triggers on its own: no webhook is installed and no workflow has
# a `triggering` section. Each build is started by a GitHub Actions job through
# .github/actions/codemagic-build (a copy of warren-app's), which passes the
# job's commit
# as `sha`, replays the step logs and publishes the verified outputs itself.
#
# Only the PowerShell checkout step comes from the ref Codemagic cloned; the
# rest runs from the requested commit. PowerShell 5.1 strips inner double
# quotes from native-command arguments, so bash only ever gets a script file.
#
# Every bash step runs under scripts/ci/codemagic/watchdog.sh, which kills a
# step that prints nothing for 5 minutes on an idle machine or for 30 minutes
# at all; scripts/ci/codemagic/test-watchdog.sh fails CI if a step escapes it.

definitions:
  pre_clone: &pre_clone
    - name: Allow long paths
      script: git config --system core.longpaths true
  checkout: &checkout
    name: Check out the requested commit
    script: |
      git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 fetch --no-tags --depth=1 origin $env:WARREN_SHA
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      git checkout --detach --quiet $env:WARREN_SHA
      exit $LASTEXITCODE
  # Downloads only, never a compiled tree (scripts/ci/codemagic/windows-env.sh
  # says what). One cache per workflow, kept 14 days;
  # `scripts/codemagic-cache.sh clear warren-sdk-ts` in the workspace empties it.
  # windows-js carries none: restoring it took longer than the downloads it
  # saved (2.6 min a build with it, 2.1 without, measured 2026-09-26).
  rust_node_cache: &rust_node_cache
    cache_paths:
      - ~/cm-tools
      - ~/cm-pnpm-store
      - ~/AppData/Local/node/corepack
      - ~/.rustup
      - ~/.cargo/bin
      - ~/.cargo/registry
      - ~/.cargo/git
  rust_cache: &rust_cache
    cache_paths:
      - ~/.rustup
      - ~/.cargo/bin
      - ~/.cargo/registry
      - ~/.cargo/git
  sha_input: &sha_input
    description: Commit to build (full SHA)

workflows:
  windows-js:
    name: js (windows)
    instance_type: windows_x2
    max_build_duration: 60
    inputs:
      sha: *sha_input
    environment:
      vars:
        CM_RECURSIVE_SUBMODULE_INIT: "false"
        WARREN_SHA: ${{ inputs.sha }}
    pre_clone_scripts: *pre_clone
    scripts:
      - *checkout
      - name: Node and dependencies
        script: |
          & 'C:\Program Files\Git\bin\bash.exe' scripts/ci/codemagic/watchdog.sh bash scripts/ci/codemagic/windows-js.sh prepare
          exit $LASTEXITCODE
      - name: Build, lint, typecheck and test
        script: |
          & 'C:\Program Files\Git\bin\bash.exe' scripts/ci/codemagic/watchdog.sh bash scripts/ci/codemagic/windows-js.sh checks
          exit $LASTEXITCODE

  napi-windows:
    name: warren-napi addon (win32-x64)
    instance_type: windows_x2
    max_build_duration: 90
    inputs:
      sha: *sha_input
    environment:
      vars:
        CM_RECURSIVE_SUBMODULE_INIT: "false"
        CARGO_TERM_COLOR: always
        WARREN_SHA: ${{ inputs.sha }}
    cache: *rust_node_cache
    pre_clone_scripts: *pre_clone
    scripts:
      - *checkout
      - name: Toolchains and engine siblings
        script: |
          & 'C:\Program Files\Git\bin\bash.exe' scripts/ci/codemagic/watchdog.sh bash scripts/ci/codemagic/napi-windows.sh prepare
          exit $LASTEXITCODE
      - name: Build the addon
        script: |
          & 'C:\Program Files\Git\bin\bash.exe' scripts/ci/codemagic/watchdog.sh bash scripts/ci/codemagic/napi-windows.sh build
          exit $LASTEXITCODE
    artifacts:
      - cm-out/*

  host-windows:
    name: warren-host (windows-x86_64)
    instance_type: windows_x2
    max_build_duration: 90
    inputs:
      sha: *sha_input
      channel:
        description: Release channel
        type: choice
        options: [prod, beta]
        default: beta
      version:
        description: Release version the binary must report
    labels:
      - ${{ inputs.channel }} ${{ inputs.version }}
    environment:
      vars:
        CM_RECURSIVE_SUBMODULE_INIT: "false"
        CARGO_TERM_COLOR: always
        CARGO_INCREMENTAL: "0"
        WARREN_SHA: ${{ inputs.sha }}
        WARREN_CHANNEL: ${{ inputs.channel }}
        WARREN_VERSION: ${{ inputs.version }}
    cache: *rust_cache
    pre_clone_scripts: *pre_clone
    scripts:
      - *checkout
      - name: Toolchain and engine siblings
        script: |
          & 'C:\Program Files\Git\bin\bash.exe' scripts/ci/codemagic/watchdog.sh bash scripts/ci/codemagic/host-windows.sh prepare
          exit $LASTEXITCODE
      - name: Test, build and package
        script: |
          & 'C:\Program Files\Git\bin\bash.exe' scripts/ci/codemagic/watchdog.sh bash scripts/ci/codemagic/host-windows.sh build
          exit $LASTEXITCODE
    artifacts:
      - cm-out/*
